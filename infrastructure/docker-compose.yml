services:
  caddy:
    image: caddy:2.8-alpine
    container_name: personal_ai_caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
      - frontend
    networks:
      - personal_ai_network

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: personal_ai_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - DEBUG=false
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/personal_ai_core
      - BACKEND_CORS_ORIGINS=http://localhost,http://localhost:3000,https://localhost
      - SECRET_KEY=replace-with-secure-production-secret-key-32-chars
      - DEFAULT_LLM_PROVIDER=groq
      - DEFAULT_MODEL_NAME=qwen/qwen3.8-27b
    volumes:
      - storage_data:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - personal_ai_network

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: personal_ai_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_BASE_URL=http://localhost:8000
    depends_on:
      - backend
    networks:
      - personal_ai_network

  postgres:
    image: pgvector/pgvector:pg16
    container_name: personal_ai_postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=personal_ai_core
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d personal_ai_core"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - personal_ai_network

networks:
  personal_ai_network:
    driver: bridge

volumes:
  postgres_data:
  storage_data:
  caddy_data:
  caddy_config:
