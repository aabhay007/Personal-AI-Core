services:
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: personal_ai_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=development
      - DEBUG=true
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/personal_ai_core
      - BACKEND_CORS_ORIGINS=http://localhost:3000,http://127.0.0.1:3000
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - personal_ai_network

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: personal_ai_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_BASE_URL=http://localhost:8000
    depends_on:
      - backend
    networks:
      - personal_ai_network

  postgres:
    image: pgvector/pgvector:pg16
    container_name: personal_ai_postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=personal_ai_core
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d personal_ai_core"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - personal_ai_network

networks:
  personal_ai_network:
    driver: bridge

volumes:
  postgres_data:
